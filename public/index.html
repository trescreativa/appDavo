<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Actualizar mi web</title>
  <style>
    /* ── Reset & variables ─────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --border:    #2a2d3e;
      --accent:    #6c63ff;
      --accent-h:  #8b84ff;
      --success:   #22c55e;
      --error:     #ef4444;
      --text:      #e2e8f0;
      --muted:     #64748b;
      --radius:    14px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      padding: 24px;
    }

    /* ── Card ──────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 24px 64px rgba(0,0,0,.45);
    }

    /* ── Header ────────────────────────────────────────────── */
    .logo {
      font-size: 32px;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -.02em;
    }
    .subtitle {
      color: var(--muted);
      font-size: .9rem;
      margin-top: 4px;
      margin-bottom: 36px;
    }

    /* ── Form elements ─────────────────────────────────────── */
    label {
      display: block;
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    input[type="password"] {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      color: var(--text);
      font-size: .95rem;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 24px;
    }
    input[type="password"]:focus { border-color: var(--accent); }

    /* ── Drop zone ─────────────────────────────────────────── */
    .dropzone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 40px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .25s, background .25s;
      margin-bottom: 24px;
      position: relative;
    }
    .dropzone.drag-over {
      border-color: var(--accent);
      background: rgba(108,99,255,.06);
    }
    .dropzone.has-file {
      border-color: var(--success);
      background: rgba(34,197,94,.05);
    }
    .dropzone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
    }
    .dz-icon { font-size: 36px; margin-bottom: 10px; }
    .dz-text {
      font-size: .95rem;
      color: var(--muted);
    }
    .dz-text span { color: var(--accent); font-weight: 600; }
    .dz-filename {
      margin-top: 8px;
      font-size: .85rem;
      color: var(--success);
      font-weight: 600;
    }

    /* ── Button ────────────────────────────────────────────── */
    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .2s, transform .1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button[type="submit"]:hover:not(:disabled) { background: var(--accent-h); }
    button[type="submit"]:active:not(:disabled) { transform: scale(.98); }
    button[type="submit"]:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    /* ── Spinner ───────────────────────────────────────────── */
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Toast ─────────────────────────────────────────────── */
    #toast {
      margin-top: 20px;
      padding: 14px 18px;
      border-radius: 8px;
      font-size: .9rem;
      font-weight: 600;
      display: none;
    }
    #toast.success { background: rgba(34,197,94,.15);  color: var(--success); border: 1px solid rgba(34,197,94,.35); }
    #toast.error   { background: rgba(239,68,68,.15);  color: var(--error);   border: 1px solid rgba(239,68,68,.35); }

    /* ── Footer ────────────────────────────────────────────── */
    .footer {
      text-align: center;
      margin-top: 32px;
      font-size: .78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<div class="card">
  <div class="logo">🌐</div>
  <h1>Actualizar mi web</h1>
  <p class="subtitle">Sube tu archivo HTML y tu sitio se actualizará al instante.</p>

  <form id="uploadForm">

    <!-- Contraseña -->
    <label for="password">Contraseña de acceso</label>
    <input type="password" id="password" name="password"
           placeholder="••••••••" autocomplete="current-password" required />

    <!-- Drop zone -->
    <label>Archivo HTML</label>
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" name="htmlFile" accept=".html,.htm" required />
      <div class="dz-icon" id="dzIcon">📄</div>
      <p class="dz-text">Arrastra tu <span>index.html</span> aquí<br>o haz clic para seleccionarlo</p>
      <p class="dz-filename" id="dzFilename"></p>
    </div>

    <!-- Botón -->
    <button type="submit" id="submitBtn">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Subir y actualizar web</span>
    </button>

    <!-- Respuesta -->
    <div id="toast"></div>
  </form>

  <p class="footer">Los archivos se suben directamente a tu servidor en Hostinger vía FTP.</p>
</div>

<script>
  const form      = document.getElementById('uploadForm');
  const fileInput = document.getElementById('fileInput');
  const dropzone  = document.getElementById('dropzone');
  const dzFilename = document.getElementById('dzFilename');
  const dzIcon    = document.getElementById('dzIcon');
  const submitBtn = document.getElementById('submitBtn');
  const spinner   = document.getElementById('spinner');
  const btnText   = document.getElementById('btnText');
  const toast     = document.getElementById('toast');

  // ── Drag & drop visual feedback
  ['dragenter', 'dragover'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag-over'); })
  );
  ['dragleave', 'drop'].forEach(evt =>
    dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag-over'); })
  );
  dropzone.addEventListener('drop', e => {
    const files = e.dataTransfer.files;
    if (files.length) {
      fileInput.files = files;
      updateDropzone(files[0]);
    }
  });

  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) updateDropzone(fileInput.files[0]);
  });

  function updateDropzone(file) {
    dropzone.classList.add('has-file');
    dzIcon.textContent = '✅';
    dzFilename.textContent = file.name;
  }

  // ── Mostrar toast
  function showToast(msg, type) {
    toast.textContent = msg;
    toast.className = type;
    toast.style.display = 'block';
  }

  // ── Enviar formulario
  form.addEventListener('submit', async e => {
    e.preventDefault();
    hideToast();
    setLoading(true);

    const data = new FormData(form);

    try {
      const res  = await fetch('/upload', { method: 'POST', body: data });
      const json = await res.json();

      if (json.ok) {
        showToast('✅  ' + json.message, 'success');
        form.reset();
        dropzone.classList.remove('has-file');
        dzIcon.textContent = '📄';
        dzFilename.textContent = '';
      } else {
        showToast('❌  ' + json.message, 'error');
      }
    } catch (err) {
      showToast('❌  No se pudo conectar con el servidor.', 'error');
    } finally {
      setLoading(false);
    }
  });

  function setLoading(on) {
    submitBtn.disabled  = on;
    spinner.style.display = on ? 'block' : 'none';
    btnText.textContent = on ? 'Subiendo...' : 'Subir y actualizar web';
  }

  function hideToast() {
    toast.style.display = 'none';
    toast.className = '';
  }
</script>

</body>
</html>
