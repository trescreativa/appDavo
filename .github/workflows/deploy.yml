name: Deploy a Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Subir archivos a Hostinger vía FTP

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm ci --omit=dev

      - name: Crear archivo .env
        run: |
          cat > .env << EOF
          FTP_HOST=191.96.56.60
          FTP_PORT=21
          FTP_USER=u111197833.orangered-weasel-837822.hostingersite.com
          FTP_PASSWORD=${{ secrets.FTP_PASSWORD }}
          FTP_REMOTE_DIR=/public_html
          UPLOAD_PASSWORD=${{ secrets.UPLOAD_PASSWORD }}
          PORT=3000
          EOF

      - name: Diagnosticar conexión FTP
        run: |
          python3 << 'PYEOF'
          import ftplib, sys, socket

          host = "191.96.56.60"
          user = "u111197833.orangered-weasel-837822.hostingersite.com"
          pwd  = "${{ secrets.FTP_PASSWORD }}"

          print(f"Host: {host}")
          print(f"User length: {len(user)} chars")
          print(f"Pass length: {len(pwd)} chars")

          # Test plain FTP
          try:
              ftp = ftplib.FTP(timeout=12)
              ftp.connect(host, 21)
              print("Conectado OK (FTP plain)")
              print("Banner:", ftp.getwelcome())
              ftp.login(user, pwd)
              print("Login OK — directorio:", ftp.pwd())
              ftp.quit()
              print("FTP_OK")
          except ftplib.error_perm as e:
              print(f"Error login FTP: {e}")
          except Exception as e:
              print(f"Error conexion FTP: {e}")

          # Test FTPS
          try:
              ftps = ftplib.FTP_TLS(timeout=12)
              ftps.connect(host, 21)
              print("Conectado OK (FTPS)")
              ftps.auth()
              ftps.login(user, pwd)
              print("Login FTPS OK — directorio:", ftps.pwd())
              ftps.quit()
              print("FTPS_OK")
          except Exception as e:
              print(f"Error FTPS: {e}")
          PYEOF

      - name: Subir archivos (FTP plano)
        continue-on-error: true
        id: ftp_plain
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 191.96.56.60
          username: u111197833.orangered-weasel-837822.hostingersite.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: /appDavo/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/.cache/**
            **/.env.example
            **/README.md

      - name: Subir archivos (FTPS — si FTP falló)
        if: steps.ftp_plain.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: 191.96.56.60
          username: u111197833.orangered-weasel-837822.hostingersite.com
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./
          server-dir: /appDavo/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/.cache/**
            **/.env.example
            **/README.md
